[build]
  base = "apps/web"
  command = "cd ../.. && npm ci && npm run build:web"
  publish = "dist"

# Client-side routing: React Router (or similar) needs every path to
# resolve back to index.html so the app's own router can take over,
# instead of Netlify returning a 404 for e.g. /aircraft/N12345.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
