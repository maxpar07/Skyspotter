# render.yaml — Render "Blueprint" config for the backend.
#
# Using this file lets Render set up the service from a single "New Blueprint"
# import instead of filling in each field by hand — but every value here can
# also just be typed into Render's dashboard manually if you'd rather not use
# a Blueprint. Either way, everything happens through Render's web UI —
# nothing here requires a local Render CLI.

services:
  - type: web
    name: skyspotter-api
    runtime: node
    plan: free
    # Root of the repo, NOT apps/api — this is deliberate. `npm install` at
    # the repo root is what makes npm workspaces link @skyspotter/shared
    # into apps/api correctly. Building or starting from inside apps/api
    # directly would miss that link.
    rootDir: .
    # npm ci (not npm install) strictly installs exactly what's pinned in
    # package-lock.json rather than potentially re-resolving newer versions
    # — this is what actually fixed a real TypeScript version mismatch that
    # broke this build previously.
    #
    # --include=dev is required here because NODE_ENV=production is set
    # below as a service env var, and Render applies env vars during the
    # build step too. npm's default behavior when NODE_ENV=production is
    # set is to skip devDependencies entirely — which silently drops
    # @types/node, @types/express, and @types/cors, since those are
    # devDependencies (correctly — they're not needed at runtime, only to
    # type-check during the build). Without this flag, tsc fails with
    # "Cannot find name 'process'/'console'/'fetch'" etc. --include=dev
    # forces npm to install them anyway, just for this build step.
    buildCommand: npm ci --include=dev && npm run build:api
    startCommand: npm run start -w apps/api
    envVars:
      - key: ACTIVE_PROVIDER
        # "failover" tries airplanes.live, then adsb.lol, then adsb.fi —
        # see FailoverProvider.ts. All three are free/independent, so one
        # throttling your IP no longer takes the whole feed down.
        value: failover
      - key: NODE_ENV
        value: production
      # PORT is injected automatically by Render — apps/api/src/server.ts
      # already reads process.env.PORT, so nothing else to configure there.
